name: BankGuard AI — CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bankguard-ai
  PYTHON_VERSION: "3.11"

# ═══════════════════════════════════════════════════════════════════════════
# JOB 1 — Test
# ═══════════════════════════════════════════════════════════════════════════
jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies (Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for tests
        run: |
          cp .env.example .env
          echo "GROQ_API_KEY=test_key" >> .env
          echo "PINECONE_API_KEY=test_key" >> .env
          echo "MONGO_URI=mongodb://localhost:27017/bankguard_test" >> .env

      - name: Run pytest
        run: |
          pytest tests/ -v \
            --tb=short \
            --timeout=60 \
            -p no:warnings

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: .pytest_cache/

# ═══════════════════════════════════════════════════════════════════════════
# JOB 2 — Build & Push Docker Image
# ═══════════════════════════════════════════════════════════════════════════
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

# ═══════════════════════════════════════════════════════════════════════════
# JOB 3 — Deploy to AWS EC2
# ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Pulling latest Docker image ==="
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            echo "=== Stopping existing containers ==="
            cd ~/bankguard-ai
            docker-compose down --remove-orphans || true

            echo "=== Updating docker-compose image tag ==="
            sed -i "s|image: .*bankguard.*|image: ${{ env.DOCKER_IMAGE }}:latest|g" docker-compose.yml

            echo "=== Starting updated containers ==="
            docker-compose up -d

            echo "=== Waiting for health check ==="
            sleep 20
            curl -f http://localhost:8000/api/health \
              && echo "✅ Deployment successful!" \
              || (echo "❌ Health check failed" && exit 1)

            echo "=== Cleaning up old images ==="
            docker image prune -f

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment job finished with status: ${{ job.status }}"
