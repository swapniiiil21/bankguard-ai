version: "3.9"

services:
  # ── MongoDB ─────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: bankguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bankguard
    volumes:
      - mongo_data:/data/db
    networks:
      - bankguard-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/bankguard
      API_PORT: "8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bankguard-net
    command: >
      python -m uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --log-level info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Streamlit Frontend ───────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankguard-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bankguard-net
    command: >
      streamlit run ui/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --server.fileWatcherType none
      --browser.gatherUsageStats false

volumes:
  mongo_data:
    driver: local

networks:
  bankguard-net:
    driver: bridge
